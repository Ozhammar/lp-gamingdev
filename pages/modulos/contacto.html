<main id="main_contacto">
    <aside>
        <h3>Si deseas visitarnos, podes encontrarnos aqui!</h3>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3283.2990992537775!2d-58.38380455970764!3d-34.621881118730975!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95b7ab12b905cb79%3A0x9b49c5472cf9171f!2sUniversidad%20Abierta%20Interamericana%20-%20UAI%20Centro!5e0!3m2!1ses-419!2sar!4v1789186999575!5m2!1ses-419!2sar" width="500" height="350" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </aside>
    <section class="contactForm">
        <h2>Contáctenos</h2>
            <form id="formContacto" action="#">
                <label for="nombre">Nombre
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre.." autocomplete="given-name" maxlength="50" required>
                </label>
                <label for="apellido">Apellido
                    <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido.." autocomplete="family-name" maxlength="50" required>
                </label>
                <label for="email">Email
                    <input type="email" id="email" name="email" placeholder="Ingrese su Email" autocomplete="email" required>
                </label>
                <label for="consulta">Consulta
                    <textarea id="consulta" name="consulta" rows="4" cols="50" minlength="10" required></textarea>
                </label>
              <button type="submit">Enviar consulta</button>

            </form>
    </section>
</main>
