<main id="main_contacto">
    <section class="contactForm">
        <h2>Contáctenos</h2>
            <form action="#">
                <label>Nombre
                    <input type="text" name="nombre" placeholder="Ingrese su nombre..">
                </label>
                <label>Apellido
                    <input type="text" name="apellido" placeholder="Ingrese su apellido..">
                </label>

            </form>
    </section>
</main>
